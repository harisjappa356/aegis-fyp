apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis.ai
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: aegis-postgres-volume
      containers:
        - name: aegis-frontend
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: aegis-backend
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: aegis.ai-worker
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: aegis.ai-eval-server
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: aegis.ai-redis
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: aegis-postgres-temp
          securityContext:
            runAsUser: 999
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
          volumeMounts:
            - name: postgres-volume
              mountPath: /var/lib/postgresql/data