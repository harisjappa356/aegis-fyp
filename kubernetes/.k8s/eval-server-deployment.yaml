apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-server
  namespace: aegis.ai
  labels:
    app: aegis
    component: eval-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis
      component: eval-server
  template:
    metadata:
      labels:
        app: aegis
        component: eval-server
    spec:
      containers:
      - name: eval-server
        image: ghcr.io/bluewave-labs/aegis.ai-eval-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # Database Configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: aegis.ai-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aegis.ai-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: aegis.ai-secrets
              key: DB_NAME

        # Backend URL
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: BACKEND_URL

        # Redis Configuration
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: REDIS_URL

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: eval-server
  namespace: aegis.ai
  labels:
    app: aegis
    component: eval-server
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: aegis
    component: eval-server
