apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis.ai
spec:
  template:
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
      containers:
        - name: aegis-frontend
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
