version: '3.9'

services:
  postgresdb:
    restart: unless-stopped
    ports:
      - $LOCAL_DB_PORT:$DB_PORT

  backend:
    restart: unless-stopped
    build:
      context: ./Servers
      dockerfile: Dockerfile.dev
    # volumes:
    #   - ./Servers/:/app
    env_file:
      - ./.env.dev

  frontend:
    restart: unless-stopped
    build:
      context: ./Clients
      dockerfile: Dockerfile.dev
    volumes:
      - ./Clients/src:/app/src
      - ./shared:/shared
    ports:
      - $FRONTEND_PORT:$FRONTEND_PORT
    env_file:
      - ./.env.dev
    environment:
      - VITE_APP_PORT=$FRONTEND_PORT
      - VITE_API_URL=http://host.docker.internal:3000

  eval_server:
    restart: unless-stopped
    build:
      context: ./EvalServer
      dockerfile: Dockerfile.dev
    volumes:
      - ./EvalServer/src:/app
      - eval_uploads-dev:/app/data/uploads

volumes:
  eval_uploads-dev:

