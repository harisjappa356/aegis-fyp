server {
    listen 80;
    server_name axomify.co www.axomify.co;

    # Certbot HTTP-01 challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS once SSL is set up
    location / {
        return 301 https://$host$request_uri;
    }
}

